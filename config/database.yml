default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # REQUIRED FOR DOCKER:
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "password") %>

development:
  <<: *default
  database: kharcha_api_development

test:
  <<: *default
  database: kharcha_api_test

production:
  primary: &primary_production
    <<: *default
    database: kharcha_api_production
    username: kharcha_api
    password: <%= ENV["KHARCHA_API_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: kharcha_api_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: kharcha_api_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: kharcha_api_production_cable
    migrations_paths: db/cable_migrate